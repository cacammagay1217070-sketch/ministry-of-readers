{% extends "base.html" %}
{% block title %}New Member{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-8">
    <h1 class="font-serif text-2xl text-burgundy-900 mb-6">Add Ministry Member</h1>
    <form method="POST" class="bg-white rounded-xl border shadow-sm p-6 space-y-4">
        <div><label class="block text-sm font-medium mb-1">Full Name *</label><input type="text" name="full_name" required class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="block text-sm font-medium mb-1">Username *</label><input type="text" name="username" required class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="block text-sm font-medium mb-1">Email *</label><input type="email" name="email" required class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="block text-sm font-medium mb-1">Password *</label><input type="password" name="password" required class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="block text-sm font-medium mb-1">Role</label>
            <select name="role" class="w-full border rounded-lg px-3 py-2 text-sm">
                <option value="member">Member</option>
                <option value="admin">Administrator</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-burgundy-900 text-white py-2.5 rounded-lg text-sm font-medium">Create Account</button>
    </form>
</div>
{% endblock %}
