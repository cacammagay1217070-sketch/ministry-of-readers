{% extends "base.html" %}
{% block title %}Members{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="font-serif text-2xl text-burgundy-900">Ministry Members</h1>
        <a href="{{ url_for('admin_new_member') }}" class="bg-burgundy-900 text-white px-4 py-2 rounded-lg text-sm font-medium">+ Add Member</a>
    </div>
    <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-burgundy-50"><tr>
                <th class="px-4 py-3 text-left">Name</th>
                <th class="px-4 py-3 text-left">Username</th>
                <th class="px-4 py-3 text-left">Role</th>
                <th class="px-4 py-3 text-left">Status</th>
            </tr></thead>
            <tbody class="divide-y">
                {% for m in members %}
                <tr>
                    <td class="px-4 py-3 font-medium">{{ m.full_name }}</td>
                    <td class="px-4 py-3">{{ m.username }}</td>
                    <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-xs {% if m.role=='admin' %}bg-gold-100 text-burgundy-900{% else %}bg-gray-100{% endif %}">{{ m.role }}</span></td>
                    <td class="px-4 py-3">{% if m.is_active %}Active{% else %}Inactive{% endif %}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
