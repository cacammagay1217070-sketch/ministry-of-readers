{% extends "base.html" %}
{% block title %}New Schedule{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="font-serif text-2xl text-burgundy-900 mb-6">Create New Mass Schedule</h1>
    <form method="POST" class="bg-white rounded-xl border shadow-sm p-6 space-y-5">
        <div class="grid sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Date *</label>
                <input type="date" name="mass_date" required class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Time *</label>
                <input type="text" name="mass_time" required placeholder="e.g. 06:00 AM" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Mass Type *</label>
                <input type="text" name="mass_type" required placeholder="Sunday Mass, Weekday, etc." class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Language</label>
                <select name="language" class="w-full border rounded-lg px-3 py-2 text-sm">
                    <option>English</option>
                    <option>Pangasinan</option>
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Location</label>
            <input type="text" name="location" value="Main Church" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Notes</label>
            <textarea name="notes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div class="border-t pt-4">
            <h3 class="font-medium mb-3">Assignments</h3>
            <div id="assignments" class="space-y-3">
                <div class="flex gap-2">
                    <input type="text" name="role[]" placeholder="Role (e.g. Commentator)" class="flex-1 border rounded-lg px-3 py-2 text-sm">
                    <select name="user_id[]" class="flex-1 border rounded-lg px-3 py-2 text-sm">
                        <option value="">Select member</option>
                        {% for m in members %}<option value="{{ m.id }}">{{ m.full_name }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <button type="button" onclick="addAssignment()" class="mt-2 text-sm text-burgundy-700 hover:underline">+ Add another role</button>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-burgundy-900 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-burgundy-800">Create Schedule</button>
            <a href="{{ url_for('schedules') }}" class="px-5 py-2.5 rounded-lg text-sm border hover:bg-gray-50">Cancel</a>
        </div>
    </form>
</div>
<script>
function addAssignment() {
    const div = document.createElement('div');
    div.className = 'flex gap-2';
    div.innerHTML = `<input type="text" name="role[]" placeholder="Role" class="flex-1 border rounded-lg px-3 py-2 text-sm">
    <select name="user_id[]" class="flex-1 border rounded-lg px-3 py-2 text-sm">
        <option value="">Select member</option>
        {% for m in members %}<option value="{{ m.id }}">{{ m.full_name }}</option>{% endfor %}
    </select>`;
    document.getElementById('assignments').appendChild(div);
}
</script>
{% endblock %}
