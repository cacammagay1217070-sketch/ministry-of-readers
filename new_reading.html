{% extends "base.html" %}
{% block title %}Upload Reading{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="font-serif text-2xl text-burgundy-900 mb-6">Upload Liturgical Reading</h1>
    <form method="POST" class="bg-white rounded-xl border shadow-sm p-6 space-y-4">
        <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium mb-1">Date *</label><input type="date" name="reading_date" required class="w-full border rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-sm font-medium mb-1">Liturgical Season</label><input type="text" name="liturgical_season" placeholder="Ordinary Time, Advent..." class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        </div>
        <div><label class="block text-sm font-medium mb-1">Celebration / Feast</label><input type="text" name="celebration" placeholder="33rd Sunday in Ordinary Time" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium mb-1">First Reading Citation</label><input type="text" name="first_reading_citation" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-sm font-medium mb-1">Psalm Citation</label><input type="text" name="psalm_citation" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        </div>
        <div><label class="block text-sm font-medium mb-1">First Reading Text</label><textarea name="first_reading" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea></div>
        <div><label class="block text-sm font-medium mb-1">Responsorial Psalm</label><textarea name="responsorial_psalm" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea></div>
        <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium mb-1">Second Reading Citation</label><input type="text" name="second_reading_citation" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-sm font-medium mb-1">Gospel Citation</label><input type="text" name="gospel_citation" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
        </div>
        <div><label class="block text-sm font-medium mb-1">Second Reading Text</label><textarea name="second_reading" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea></div>
        <div><label class="block text-sm font-medium mb-1">Gospel Text</label><textarea name="gospel" rows="4" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea></div>
        <div><label class="block text-sm font-medium mb-1">Notes for Readers</label><textarea name="notes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea></div>
        <button type="submit" class="bg-burgundy-900 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-burgundy-800">Upload Reading</button>
    </form>
</div>
{% endblock %}
